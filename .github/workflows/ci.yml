name: Continuous Integration

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Test across multiple Python versions to guarantee package cross-compatibility
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    # 1. Check out the repository source code so the runner can access it
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the specific Python runtime environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Automatically caches pip dependencies to make subsequent runs faster

    # 3. Upgrade core packaging tools
    - name: Upgrade Pip and Build Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    # 4. Install your package in editable mode along with [dev] test requirements
    - name: Install Package and Dependencies
      run: |
        pip install -e ".[dev]"

    # 5. Execute your split testing suite (test_entities.py and test_time_space.py)
    - name: Run Test Suite via Pytest
      run: |
        pytest -v