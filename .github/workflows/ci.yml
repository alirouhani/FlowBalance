name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Matrix Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Match the modern cross-compatibility matrix supported by your tox.ini
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    # 1. Check out the repository source code so the runner can access it
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the specific Python runtime environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Automatically caches dependencies to accelerate runs

    # 3. Install build dependencies and the C++ compilation suite
    - name: Install System Compiler Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev

    # 4. Install tox and the GitHub Actions environment mapper
    - name: Install Test Automation Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install tox tox-gh-actions

    # 5. Execute tox using parallel GitHub runner environments
    # tox-gh-actions will automatically restrict execution on this specific runner 
    # to the environment matching the current active matrix version.
    - name: do Tox
      run: |
        tox