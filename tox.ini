[tox]
# Defines the isolated target Python environments to build and test against
envlist = py310, py311, py312, py313

# Maps the GitHub Actions matrix version directly to the matching tox environment
[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    
[testenv]
# Installs necessary runtime and testing dependencies inside the sandboxes
deps = 
    pytest
    pydantic
    pandas
    ortools

# Commands executed systematically to verify build and algorithmic integrity
commands = 
    # Execute the test suite with verbose reporting
    pytest tests/ -v